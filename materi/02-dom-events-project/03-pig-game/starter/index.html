<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pig Game 🎲 (Game Dadu 2 Pemain)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!-- Pemain 1 (Indeks 0) -->
      <section class="player player--0 player--active">
        <h2 class="name" id="name--0">Pemain 1</h2>
        <p class="score" id="score--0">0</p>
        <div class="current">
          <p class="current-label">Skor Saat Ini</p>
          <p class="current-score" id="current--0">0</p>
        </div>
      </section>

      <!-- Pemain 2 (Indeks 1) -->
      <section class="player player--1">
        <h2 class="name" id="name--1">Pemain 2</h2>
        <p class="score" id="score--1">0</p>
        <div class="current">
          <p class="current-label">Skor Saat Ini</p>
          <p class="current-score" id="current--1">0</p>
        </div>
      </section>

      <!-- Visual Dadu (Bisa berupa angka atau titik dadu) -->
      <div class="dice hidden" id="dice">🎲</div>

      <!-- Tombol-tombol Kontrol -->
      <button class="btn btn--new">🔄 Game Baru</button>
      <button class="btn btn--roll">🎲 Lempar Dadu</button>
      <button class="btn btn--hold">📥 Simpan Skor</button>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
