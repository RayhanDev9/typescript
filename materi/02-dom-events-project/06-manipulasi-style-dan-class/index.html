<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06 · Manipulasi Style & Class</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 2rem;
      max-width: 650px;
      margin: 0 auto;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Class untuk manipulasi classList */
    .kartu-demo {
      background-color: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      border: 2px solid #334155;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
    }

    .kartu-demo.highlight {
      border-color: #f59e0b;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
      transform: scale(1.02);
    }

    .kartu-demo.tema-terang {
      background-color: #f8fafc;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    .tersembunyi {
      display: none !important;
    }

    .btn-grup {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    button {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      border: none;
      background-color: #0284c7;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>
  <div id="kotak-preview" class="kartu-demo">
    <h1 id="judul-kartu">Preview Manipulasi Gaya & Class</h1>
    <p id="teks-konten">
      Teks ini dapat berubah ukuran, warna tema, dan status highlight-nya secara dinamis
      melalui TypeScript!
    </p>

    <div class="btn-grup">
      <button id="btn-toggle-tema">🌓 Toggle Tema Terang/Gelap</button>
      <button id="btn-toggle-highlight">⭐ Toggle Highlight</button>
      <button id="btn-besarkan-font">🔤 Besarkan Font (Inline)</button>
    </div>
  </div>

  <script type="module" src="./contoh.ts"></script>
</body>
</html>
